name: inside_bmhg
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.9.2
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  fpdart: ^1.2.0
  flutter_bloc: ^9.1.1
  geolocator: ^13.0.1
  get_it: ^9.2.1
  go_router: ^17.2.3
  injectable: ^3.0.0
  shared_preferences: ^2.5.5
  permission_handler: ^11.3.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-Black.ttf
          weight: 900